<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f2f5">
  <title>WA Monitor</title>
  <script>
    // Resolve the theme before first paint so there's no light/dark flash.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Navigasi"></nav>
    <section class="list-pane" id="list-pane"></section>
    <main class="main-pane" id="main-pane"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
